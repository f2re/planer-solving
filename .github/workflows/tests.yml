name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=. pytest -q tests

      - name: Compile Python modules
        run: python -m py_compile src/schedule_analyzer.py src/data_loader.py web/backend/main.py web/backend/schemas.py

      - name: Check frontend JavaScript
        run: node --check web/frontend/assets/app.js
