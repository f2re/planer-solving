name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=. pytest -q tests

      - name: Compile Python modules
        run: |
          python -m py_compile \
            src/schedule_layout.py src/worksheet_matrix.py src/schedule_detection.py \
            src/schedule_analyzer.py src/teacher_resolver.py src/operator_issues.py src/schedule_parser_geometry.py \
            src/schedule_period_values.py src/schedule_period_validation.py src/schedule_calendar.py src/schedule_period.py src/data_loader.py \
            src/transformer.py src/weekly_exporter.py src/template_matcher.py \
            src/template_learning.py src/import_wizard.py src/security.py \
            src/workspace_domain.py src/workspace_store.py src/sqlite_workspace_store.py \
            src/platform_store.py src/transactional_platform_store.py src/data_migrations.py \
            tools/migrate.py tools/healthcheck.py tools/service_preflight.py tools/user_admin.py \
            offline/build_bundle.py offline/python_runtime.py offline/verify_bundle.py \
            web/backend/main.py web/backend/app_factory.py web/backend/app_context.py \
            web/backend/auth.py web/backend/password_reset_session.py web/backend/frontend_cache.py \
            web/backend/platform_api.py web/backend/errors.py web/backend/recovery_catalog.py web/backend/recovery_status.py \
            web/backend/analysis_api.py web/backend/session_api.py web/backend/session_file_api.py web/backend/session_draft_api.py web/backend/system_api.py \
            web/backend/workspace_api.py web/backend/workspace_schedule.py web/backend/schemas.py

      - name: Assert clean backend architecture
        run: |
          test ! -e web/backend/legacy_main.py
          ! grep -R "exec(compile" -n web/backend
          ! grep -R "app.router.routes\[:\]" -n web/backend
          ! grep -R "WorkspaceStore.load =" -n web/backend
          ! grep -R "class WorkspaceStore" -n src

      - name: Check shell scripts
        run: |
          bash -n start_web.sh
          bash -n offline/build_offline_bundle.sh
          bash -n offline/install_from_archive.sh
          bash -n offline/common.sh
          bash -n offline/install_or_update.sh
          bash -n offline/python_discovery.sh
          bash -n offline/verify_bundle.sh
          bash -n offline/runtime.sh
          bash -n offline/doctor.sh
          bash -n offline/rollback.sh

      - name: Check frontend JavaScript
        run: |
          node --check web/frontend/assets/app.js
          node --check web/frontend/assets/brand-refresh.js
          node --check web/frontend/assets/failure-recovery.js
          node --check web/frontend/assets/fetch-recovery.js
          node --check web/frontend/assets/planner-app.js
          node --check web/frontend/assets/operator-flow.js
          node --check web/frontend/assets/session-file-actions.js
          node --check web/frontend/assets/session-draft-runtime.js
          node --check web/frontend/assets/teacher-mapping-state.js
          node --check web/frontend/assets/editor-history-state.js
          node --check web/frontend/assets/history-ux.js
          node --check web/frontend/assets/history-ux-state.js
          node --check web/frontend/assets/unified-operations.js
          node --check web/frontend/assets/workspace-state.js
          node --check web/frontend/assets/reactive-workspace.js
          node --check web/frontend/assets/schedule-layout-utils.js
          node --check web/frontend/assets/schedule-state.js
          node --check web/frontend/assets/interaction-ui.js
          node --check web/frontend/assets/interaction-markup.js
          node --check web/frontend/assets/interaction-state.js
          node --check web/frontend/assets/sample-layout-markup.js
          node --check web/frontend/assets/sample-layout-editor.js
          node --check web/frontend/assets/editor-workspace-markup.js
          node --check web/frontend/assets/editor-workspace.js
          node --check web/frontend/assets/ui-runtime-fixes.js
          node --check web/frontend/assets/platform-ui.js
          node --check web/frontend/assets/platform-enhancements.js
          node tests/frontend_runtime_probe.mjs
          node tests/frontend_boot_probe.mjs
          node tests/editor_history_probe.mjs

      - name: Build autonomous runtime bundle
        run: bash offline/build_offline_bundle.sh --output dist --python "$(command -v python)"

      - name: Verify package entrypoint
        run: |
          test -x dist/install-planner-solving.sh
          bash -n dist/install-planner-solving.sh
          test -s dist/README-INSTALL.txt
          test "$(find dist -maxdepth 1 -name 'planner-solving-offline-*-runtime.tar.gz' | wc -l)" -eq 1

      - name: Verify archive checksum
        run: cd dist && sha256sum -c *.tar.gz.sha256

      - name: Test Python discovery, immutable release, page startup, repair and update preservation
        run: |
          set -Eeuo pipefail
          install_root="$RUNNER_TEMP/planner-solving-install"
          extract_root="$RUNNER_TEMP/planner-solving-bundle"
          archive="$(find dist -maxdepth 1 -name 'planner-solving-offline-*-runtime.tar.gz' | head -n 1)"
          mkdir -p "$extract_root"
          tar -xzf "$archive" -C "$extract_root"
          bundle="$(find "$extract_root" -mindepth 1 -maxdepth 1 -type d -name 'planner-solving-offline-*' | head -n 1)"
          test -x "$bundle/python-runtime/python"

          env PLANNER_INVOKING_USER="$(id -un)" PLANNER_INVOKING_HOME="$HOME" \
            bash "$bundle/install_or_update.sh" \
              --install-dir "$install_root" \
              --service-user "$(id -un)" \
              --python bundled \
              --strict-python \
              --list-python \
              --no-systemd

          env PLANNER_INVOKING_USER="$(id -un)" PLANNER_INVOKING_HOME="$HOME" \
            bash "$bundle/install_or_update.sh" \
              --install-dir "$install_root" \
              --service-user "$(id -un)" \
              --python bundled \
              --strict-python \
              --port 18081 \
              --no-systemd \
              --yes

          first_release="$(readlink -f "$install_root/current")"
          test -L "$first_release/teachers.json"
          test "$(readlink -f "$first_release/teachers.json")" = "$(readlink -f "$install_root/shared/teachers.json")"

          # The production release is root-owned and immutable. Reproduce that
          # contract even in the unprivileged CI installation. A regression to
          # release/teachers.json.tmp now fails here deterministically.
          chmod a-w "$first_release"
          env PLANNER_INSTALL_ROOT="$install_root" PLANNER_PORT=18081 \
            "$install_root/state/run-service.sh" --check
          test ! -e "$first_release/teachers.json.tmp"
          test "$(find "$first_release" -maxdepth 1 -name '.teachers.json.*.tmp' | wc -l)" -eq 0

          # Start the exact installed runtime and verify the HTML entrypoint and
          # the module that previously prevented the page from loading.
          server_log="$RUNNER_TEMP/planner-solving-server.log"
          env PLANNER_INSTALL_ROOT="$install_root" PLANNER_PORT=18081 \
            "$install_root/state/run-service.sh" >"$server_log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          "$install_root/current/.venv/bin/python" - 18081 <<'PY'
          import sys, time
          from urllib.error import URLError
          from urllib.request import urlopen

          port = int(sys.argv[1])
          base = f"http://127.0.0.1:{port}"
          last_error = None
          for _ in range(60):
              try:
                  with urlopen(base + "/api/health", timeout=2) as response:
                      if response.status == 200:
                          break
              except (OSError, URLError) as exc:
                  last_error = exc
                  time.sleep(1)
          else:
              raise SystemExit(f"server did not start: {last_error}")

          expectations = {
              "/": "Борис по парам",
              "/assets/app.js": "__plannerSolvingBoot",
              "/assets/planner-app.js": "export function mount",
              "/assets/unified-operations.js": "installUnifiedOperationsRuntime",
          }
          for path, marker in expectations.items():
              with urlopen(base + path, timeout=4) as response:
                  body = response.read().decode("utf-8")
                  assert response.status == 200, (path, response.status)
                  assert marker in body, (path, marker)
          PY
          kill "$server_pid"
          wait "$server_pid" || true
          trap - EXIT

          env PLANNER_INSTALL_ROOT="$install_root" \
            "$install_root/state/python-info.sh" > "$RUNNER_TEMP/python-info.txt"
          grep -F "Рабочий venv:" "$RUNNER_TEMP/python-info.txt"
          grep -F "Управляемый runtime:" "$RUNNER_TEMP/python-info.txt"

          printf 'preserve-me\n' > "$install_root/shared/data/installer-preservation-marker"

          env PLANNER_INVOKING_USER="$(id -un)" PLANNER_INVOKING_HOME="$HOME" \
            bash "$bundle/install_or_update.sh" \
              --install-dir "$install_root" \
              --service-user "$(id -un)" \
              --python "$bundle/python-runtime" \
              --strict-python \
              --repair \
              --port 18081 \
              --no-systemd \
              --yes

          second_release="$(readlink -f "$install_root/current")"
          test "$first_release" != "$second_release"
          test "$(cat "$install_root/shared/data/installer-preservation-marker")" = "preserve-me"
          chmod a-w "$second_release"
          env PLANNER_INSTALL_ROOT="$install_root" PLANNER_PORT=18081 \
            "$install_root/state/run-service.sh" --check
          test ! -e "$second_release/teachers.json.tmp"
          (
            cd "$RUNNER_TEMP"
            "$install_root/state/admin.sh" list >/dev/null
            "$install_root/current/.venv/bin/python" -m tools.healthcheck \
              --app-root "$install_root/current" \
              --data-dir "$install_root/shared/data" >/dev/null
          )
          test "$(cat "$install_root/current/VERSION")" = "$(cat VERSION)"
          test -x "$install_root/current/.venv/bin/python"
          test -x "$install_root/state/doctor.sh"
          test -x "$install_root/state/python-info.sh"

      - name: Upload installable bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: planner-solving-offline-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
